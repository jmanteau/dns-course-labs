[project]
name = "dns-cyber-lab-guide"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "docker>=7.1",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "tldextract>=5.1",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-timeout>=2.2",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
timeout = 600
