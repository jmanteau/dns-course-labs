
services:
  # Firewall
  firewall:
    image: alpine:3.20
    container_name: firewall
    networks:
      - internal_network
      - public_network
    privileged: true 
    cap_add:
      - NET_ADMIN
    volumes:
      - ./firewall/start.sh:/start.sh
    entrypoint: ["/bin/sh", "-c", "/start.sh"]


  # Internal Network
  client:
    image: alpine:3.20
    container_name: client
    networks:
      - internal_network
    depends_on:
      - dns_internal
    environment:
      - DNS_SERVER_IP=  # Placeholder for the IP of dns_internal
    entrypoint: ["/bin/sh", "-c", "/start.sh"]
    volumes:
      - ./client/start.sh:/start.sh
      - ./shared-data:/shared-data  

  dns_internal:
    image: dns-cyber-lab-bind9:latest
    pull_policy: never
    container_name: dns_internal
    networks:
      - internal_network
    depends_on:
      - dns_public
      - firewall
    environment:
      - TZ=UTC
    cap_add:
      - NET_ADMIN
    privileged: true
    volumes:
      - ./dns_internal/etc/bind:/etc/bind
      - ./dns_internal/var/cache/bind:/var/cache/bind
      - ./dns_internal/var/lib/bind:/var/lib/bind
      - ./dns_internal/var/log:/var/log
      - ./dns_internal/start.sh:/start.sh
      - ./shared-data:/shared-data
      - ./dns_internal/analysis.py:/analysis.py
    tmpfs:
      - /run/named
    entrypoint: ["/bin/sh", "-c", "/start.sh"]



  # Public Network
  dns_public:
    image: dns-cyber-lab-bind9:latest
    pull_policy: never
    container_name: dns_public
    networks:
      - public_network
    depends_on:
      - firewall
    environment:
      - TZ=UTC
    cap_add:
      - NET_ADMIN
    privileged: true
    volumes:
      - ./dns_public/etc/bind:/etc/bind
      - ./dns_public/var/cache/bind:/var/cache/bind
      - ./dns_public/var/lib/bind:/var/lib/bind
      - ./dns_public/var/log:/var/log
      - ./dns_public/start.sh:/start.sh
      - ./shared-data:/shared-data
    tmpfs:
      - /run/named
    entrypoint: ["/bin/sh", "-c", "/start.sh"]

  c2_server:
    image: dns-cyber-lab-c2_server:latest
    pull_policy: build
    build:
      context: .
      dockerfile: c2_server/Dockerfile
    privileged: true
    container_name: c2_server
    networks:
      - public_network
    ports:
      - "8888:8888"
      - "8443:8443"
      - "31337:31337"
    volumes:
      - ./shared-data:/shared-data  
    tty: true
    stdin_open: true


  webserver:
    image: nginx:1.27-alpine
    container_name: webserver
    ports:
      - "8090:80"
    networks:
      - public_network
    volumes:
      - ./web_content:/usr/share/nginx/html

  lab_guide:
    build:
      context: ./lab_guide
      dockerfile: Dockerfile
    container_name: lab_guide
    ports:
      - "8085:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dns_internal/var/log:/app/dns_logs:ro
      - ./dns_internal/etc/bind:/app/dns_config:ro
    security_opt:
      - label=disable
    networks:
      - internal_network
      - public_network
    depends_on:
      - dns_internal


networks:
  internal_network:
    driver: bridge
  public_network:
    driver: bridge
