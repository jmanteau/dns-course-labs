project:
  type: default
  output-dir: _site

# top level, not under format, so that `make single` can turn it off (theme/single.yml)
chalkboard:
  buttons: false

filters:
  - theme/link-icons.lua
  - theme/part-footer.lua

format:
  revealjs:
    theme: [default, theme/dns.scss]
    width: 1280
    height: 720
    margin: 0
    center: false
    slide-number: c
    hash: true
    transition: none
    controls: true
    menu: false
    progress: true
    code-copy: false
    highlight-style: github
    pdf-separate-fragments: false
    smaller: false
    link-external-newwindow: true
    include-in-header: theme/fonts.html
